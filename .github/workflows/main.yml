name: vProfile CI/CD Pipeline

# ──────────────────────────────────────────
# TRIGGER: Run when code is pushed to main
# ──────────────────────────────────────────
on:
  push:
    branches: [ main ]

# ──────────────────────────────────────────
# CONCURRENCY: Cancel older runs if a new
# push arrives on the same branch
# ──────────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────
# PERMISSIONS: Minimal required permissions
# ──────────────────────────────────────────
permissions:
  contents: read

# ──────────────────────────────────────────
# GLOBAL VARIABLE: Docker image name
# Change DOCKER_USERNAME secret accordingly
# ──────────────────────────────────────────
env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/vprofileapp

# ══════════════════════════════════════════
#                   JOBS
# ══════════════════════════════════════════
jobs:

# ┌─────────────────────────────────────────┐
# │  JOB 1 — BUILD                          │
# │  Compile Java code using Maven          │
# │  Output: vprofile-v2.war file           │
# └─────────────────────────────────────────┘
  BUILD:
    name: 🔨 Build Java App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build WAR File with Maven
        run: mvn clean install -DskipTests

      - name: Save WAR File for Later Jobs
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-war
          path: target/vprofile-v2.war
          retention-days: 1


# ┌─────────────────────────────────────────┐
# │  JOB 2 — TEST                           │
# │  Run unit tests to check code works     │
# │  Needs: JOB 1 to pass first             │
# └─────────────────────────────────────────┘
  TEST:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    needs: BUILD

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run All Unit Tests
        run: mvn test


# ┌─────────────────────────────────────────┐
# │  JOB 3 — CHECKSTYLE                     │
# │  Check if Java code follows standards   │
# │  Needs: JOB 1 to pass first             │
# └─────────────────────────────────────────┘
  CHECKSTYLE:
    name: 📋 Code Quality Check
    runs-on: ubuntu-latest
    needs: BUILD

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle Analysis
        run: mvn checkstyle:checkstyle

      - name: Upload Checkstyle Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml


# ┌─────────────────────────────────────────┐
# │  JOB 4 — DOCKER                         │
# │  Build Docker image and push to Hub     │
# │  Needs: TEST + CHECKSTYLE to pass       │
# └─────────────────────────────────────────┘
  DOCKER:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [ TEST, CHECKSTYLE ]

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Download WAR File from Build Job
        uses: actions/download-artifact@v4
        with:
          name: vprofile-war
          path: target/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.DOCKER_IMAGE }}:${{ github.run_number }} \
            -t ${{ env.DOCKER_IMAGE }}:latest \
            -f Docker-files/app/Dockerfile .

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}
          docker push ${{ env.DOCKER_IMAGE }}:latest


# ┌─────────────────────────────────────────┐
# │  JOB 5 — DEPLOY                         │
# │  Deploy updated app to Kubernetes       │
# │  Needs: DOCKER job to pass first        │
# └─────────────────────────────────────────┘
  DEPLOY:
    name: 🚀 Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: DOCKER

    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Install kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Setup Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify Cluster Connection
        run: |
          CLUSTER_NAME=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')
          kubectl config set-cluster $CLUSTER_NAME --insecure-skip-tls-verify=true
          kubectl cluster-info

      - name: Update App Image Tag in Deployment File
        run: |
          sed -i "s|image: .*vprofileapp.*|image: ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}|g" \
            kubedefs/appdeploy.yaml

      - name: Deploy All Services to Kubernetes
        run: |
          kubectl apply -f kubedefs/secret.yaml
          kubectl apply -f kubedefs/dbpvc.yaml
          kubectl apply -f kubedefs/dbdeploy.yaml
          kubectl apply -f kubedefs/dbservice.yaml
          kubectl apply -f kubedefs/mcdep.yaml
          kubectl apply -f kubedefs/mcservice.yaml
          kubectl apply -f kubedefs/rmqdeploy.yaml
          kubectl apply -f kubedefs/rmqservice.yaml
          kubectl apply -f kubedefs/appdeploy.yaml
          kubectl apply -f kubedefs/appservice.yaml
          kubectl apply -f kubedefs/appingress.yaml

      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/vproapp --timeout=120s
          echo "✅ All Pods Status:"
          kubectl get pods
          echo "✅ All Services:"
          kubectl get svc
